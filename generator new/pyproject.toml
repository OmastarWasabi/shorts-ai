[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-ai"
version = "0.1.0"
description = "Генерация материалов и монтаж коротких видео"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx==0.28.1",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
timing = ["whisperx==3.8.6"]

[project.scripts]
shorts-ai = "shorts_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shorts_ai = ["NOTICE"]
